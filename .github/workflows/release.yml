name: release

# Runs only when a release tag is cut. The image is the release artifact: the
# cgo parser is compiled in, so a deployment file can run the CLI with no Go
# toolchain, C compiler, or shared library on the host.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and push the image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derives the image tags from the git tag: v1.2.3 becomes 1.2.3, and
      # latest is added only for non-prerelease versions. The repository name
      # is lowercased for ghcr automatically.
      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=semver,pattern={{version}}

      # The Dockerfile cross-compiles the arm64 leg on this amd64 runner, so
      # no QEMU is registered: emulating the Postgres parser's C build would
      # take tens of minutes. provenance is off to keep the pushed manifest a
      # plain two-platform list.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
