name: issue title

# Issue titles follow the same Conventional Commits format the commits do,
# with the same rules commitlint applies: the config-conventional types and a
# 100 character ceiling. An invalid title gets the `invalid` label and one
# explanatory comment; fixing the title removes both.
on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            const title = issue.title;

            const types = ['build', 'chore', 'ci', 'docs', 'feat', 'fix',
              'perf', 'refactor', 'revert', 'style', 'test'];
            const pattern = new RegExp(`^(${types.join('|')})(\\([^)]+\\))?!?: \\S`);
            const max = 100;

            const problems = [];

            if (!pattern.test(title)) {
              problems.push('the title is not `type(optional-scope): summary` ' +
                `with one of: ${types.join(', ')}`);
            }

            if (title.length > max) {
              problems.push(`the title is ${title.length} characters; the limit is ${max}`);
            }

            const marker = '<!-- issue-title-lint -->';
            const comments = await github.rest.issues.listComments({
              owner, repo, issue_number: issue.number, per_page: 100,
            });
            const existing = comments.data.find((c) => c.body.includes(marker));

            if (problems.length === 0) {
              if (existing) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: existing.id });
              }

              const labels = issue.labels.map((l) => (typeof l === 'string' ? l : l.name));

              if (labels.includes('invalid')) {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: issue.number, name: 'invalid',
                });
              }

              return;
            }

            const body = [
              marker,
              'Issue titles follow the same [Conventional Commits](https://www.conventionalcommits.org/en/v1.0.0/) format as commit messages:',
              '',
              '```',
              'type(optional-scope): short summary',
              '```',
              '',
              'With this title:',
              ...problems.map((p) => `- ${p}`),
              '',
              'Edit the title and the `invalid` label will be removed.',
            ].join('\n');

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number, body,
              });
            }

            await github.rest.issues.addLabels({
              owner, repo, issue_number: issue.number, labels: ['invalid'],
            });

            core.setFailed(problems.join('; '));
