name: build

# Markdown-only changes do not touch anything the pipeline verifies, and the
# suite costs real minutes: containers, two Postgres majors, a race run.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC
  CGO_ENABLED: "1" # pg_query_go links the Postgres parser
  GOTOOLCHAIN: local # never auto-upgrade the toolchain mid-run

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache-dependency-path: go.sum
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout 10m --config .golangci.yml

  test:
    name: Test and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache-dependency-path: go.sum

      - run: go version
      - run: go mod download
      - run: go build ./...

      # The suite spawns the migrator as a real process and kills it, so the
      # runner needs a working docker daemon for testcontainers. Pulling ahead
      # of time keeps the first container's startup timeout honest.
      - name: Pull the Postgres image
        run: docker pull postgres:18-alpine

      - name: Test with coverage
        run: make cover

      - name: Publish the coverage summary
        if: always()
        run: make cover-summary >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: .cover/coverage.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-profile
          path: .cover/coverage.out
          if-no-files-found: warn

  race:
    name: Race detector
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache-dependency-path: go.sum

      - run: go mod download
      - name: Pull the Postgres image
        run: docker pull postgres:18-alpine
      - run: make test

  # What Windows can be held to. The shipped code builds and its unit tests
  # run; the container suite does not, because the harness drives the migrator
  # as a POSIX process group and this runner has no Linux docker. The package
  # list is computed rather than written down, so a package that later grows a
  # container test drops out of this job by itself instead of breaking it.
  windows:
    name: Build and unit tests on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache-dependency-path: go.sum

      - name: Check the C toolchain cgo needs
        run: gcc --version

      - run: go mod download
      - name: Build the shipped code
        run: go build ./cmd/... ./internal/... ./pkg/...

      - name: Unit tests
        run: |
          units=$(for p in $(go list ./cmd/... ./internal/... ./pkg/...); do
            go list -test -deps "$p" | grep -q 'test/harness' || echo "$p"
          done)
          echo "$units"
          go test -count=1 $units

  # Recovery behaviour for a concurrently-built index is version-sensitive, so
  # the matrices have to pass on more than the one major the harness defaults
  # to. This job runs them against the previous one.
  postgres-matrix:
    name: Recovery matrix on Postgres ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        postgres: ["17", "18"]
    env:
      MIG_PG_IMAGE: postgres:${{ matrix.postgres }}-alpine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache-dependency-path: go.sum

      - run: go mod download
      - name: Pull the Postgres image
        run: docker pull "$MIG_PG_IMAGE"
      - name: Recovery and lease matrices
        run: go test ./test/... ./internal/lease/... ./internal/step/... -count=1 -timeout 30m

      # A step of its own, after the rest: the linter's duration estimates are
      # held to a measured rewrite, and a measurement taken while the other
      # packages are running reports the load rather than the model.
      - name: Estimate acceptance
        env:
          MIG_ESTIMATE: "1"
        run: go test ./test/estimate/ -count=1 -timeout 15m -v
